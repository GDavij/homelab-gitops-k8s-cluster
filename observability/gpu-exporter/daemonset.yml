---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dcgm-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: dcgm-exporter
    app.kubernetes.io/instance: dcgm-exporter
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dcgm-exporter
      app.kubernetes.io/instance: dcgm-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dcgm-exporter
        app.kubernetes.io/instance: dcgm-exporter
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/managed-by: argocd
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: dcgm-exporter
          image: nvidia/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04
          ports:
            - name: metrics
              containerPort: 9400
              hostPort: 9400
              protocol: TCP
          securityContext:
            runAsNonRoot: false
            capabilities:
              add:
                - SYS_ADMIN
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          volumeMounts:
            - name: dcgm-config
              mountPath: /etc/dcgm-exporter
              readOnly: true
      volumes:
        - name: dcgm-config
          configMap:
            name: dcgm-exporter-config
            optional: false
