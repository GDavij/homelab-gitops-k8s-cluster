---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: otel-collector
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/instance: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: otel-collector
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/managed-by: argocd
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.114.0
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          args: ["--config=/etc/otel/config.yaml"]
          env:
            - name: LANGFUSE_AUTH_BASE64
              valueFrom:
                secretKeyRef:
                  name: otel-secrets
                  key: LANGFUSE_AUTH_BASE64
          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP
            - name: otlp-http
              containerPort: 4318
              protocol: TCP
            - name: prometheus
              containerPort: 8888
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: tls-cert
              mountPath: /certs/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: tls-cert
              mountPath: /certs/tls.key
              subPath: tls.key
              readOnly: true
            - name: ca-cert
              mountPath: /certs/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            - name: journal-state
              mountPath: /var/lib/otelcol/journal
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 13133
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        - name: tls-cert
          secret:
            secretName: monster-server-cert
        - name: ca-cert
          secret:
            secretName: monster-ca-trust
        - name: varlog
          hostPath:
            path: /var/log
            type: DirectoryOrCreate
        - name: journal
          hostPath:
            path: /var/log/journal
            type: DirectoryOrCreate
        - name: journal-state
          emptyDir: {}
