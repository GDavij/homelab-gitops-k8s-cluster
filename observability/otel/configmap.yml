---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: observability
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: otel-collector
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel'
              static_configs: []

      filelog/containers:
        include:
          - /var/log/pods/*/*/*.log
        start_at: beginning
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: pod-parser
            add_metadata_from_filepath: true
          - type: recombine
            id: log-combiner
            combine_field: attributes["log.iostream"]
            combine_with: ""
            max_log_size: 1048576
            source_identifier: attributes["log.file.path"]
            is_first_entry: attributes["log.flag"] == 1

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1024
      memory_limiter:
        check_interval: 5s
        limit_mib: 768
        spike_limit_mib: 256

      # Metrics-only filter: multiple list items = OR in OTTL
      # Drops spans/metrics matching ANY condition
      filter/keep_genai:
        error_mode: ignore
        metrics:
          datapoint:
            - 'attributes["gen_ai.system"] != nil'
            - 'attributes["gen_ai.provider.name"] != nil'

      filter/drop_genai:
        error_mode: ignore
        metrics:
          datapoint:
            - 'attributes["gen_ai.system"] != nil'
            - 'attributes["gen_ai.provider.name"] != nil'

      resource/k8s_attrs:
        attributes:
          - key: k8s.cluster.name
            value: homelab
            action: upsert

      transform/logs_resource:
        error_mode: ignore
        log_statements:
          - context: log
            statements:
              - set(attributes["log.source"], "k8s-container") where attributes["log.file.path"] != nil
              - set(attributes["log.source"], "journald") where attributes["log.source"] == nil

    exporters:
      prometheusremotewrite:
        endpoint: "https://metrics.lab:443/api/v1/write"
        tls:
          cert_file: /certs/tls.crt
          key_file: /certs/tls.key
          ca_file: /certs/ca.crt

      otlphttp/jaeger:
        endpoint: "https://ingestion.traces.lab:443"
        tls:
          cert_file: /certs/tls.crt
          key_file: /certs/tls.key
          ca_file: /certs/ca.crt

      otlphttp/langfuse_traces:
        traces_endpoint: "http://langfuse-web.observability.svc:3000/api/public/otel/v1/traces"
        headers:
          Authorization: "Basic ${env:LANGFUSE_AUTH_BASE64}"
          x-langfuse-ingestion-version: "4"
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      otlphttp/langfuse_metrics:
        metrics_endpoint: "http://langfuse-web.observability.svc:3000/api/public/otel/v1/metrics"
        headers:
          Authorization: "Basic ${env:LANGFUSE_AUTH_BASE64}"
          x-langfuse-ingestion-version: "4"

      otlphttp/victorialogs:
        logs_endpoint: "https://logs.lab:443/insert/opentelemetry/v1/logs"
        tls:
          cert_file: /certs/tls.crt
          key_file: /certs/tls.key
          ca_file: /certs/ca.crt

      debug:
        verbosity: normal

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        # Cluster metrics from vmagent (prometheus receiver)
        metrics/cluster:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite]

        # Non-GenAI application metrics → VictoriaMetrics only
        metrics/application:
          receivers: [otlp]
          processors: [memory_limiter, filter/drop_genai, resource/k8s_attrs, batch]
          exporters: [prometheusremotewrite]

        # GenAI metrics → VictoriaMetrics + Langfuse
        metrics/genai:
          receivers: [otlp]
          processors: [memory_limiter, filter/keep_genai, resource/k8s_attrs, batch]
          exporters: [prometheusremotewrite, otlphttp/langfuse_metrics]

        # ALL traces → Jaeger + Langfuse (no filter, no split)
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource/k8s_attrs, batch]
          exporters: [otlphttp/jaeger, otlphttp/langfuse_traces]

        # Container logs → VictoriaLogs
        logs/containers:
          receivers: [filelog/containers]
          processors: [memory_limiter, transform/logs_resource, batch]
          exporters: [otlphttp/victorialogs]

        # Node journald logs → VictoriaLogs
        # TODO: re-enable when journald receiver config is updated for OTel 0.114+
        # logs/journald:
        #   receivers: [journald/node]
        #   processors: [memory_limiter, transform/logs_resource, batch]
        #   exporters: [otlphttp/victorialogs]
