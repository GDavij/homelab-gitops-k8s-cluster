---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: observability
  labels:
    app.kubernetes.io/name: vmagent
    app.kubernetes.io/instance: vmagent
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmagent
      app.kubernetes.io/instance: vmagent
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmagent
        app.kubernetes.io/instance: vmagent
        app.kubernetes.io/part-of: observability
        app.kubernetes.io/managed-by: argocd
    spec:
      serviceAccountName: vmagent-sa
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: vmagent
          image: victoriametrics/vmagent:v1.107.0
          args:
            - -promscrape.config=/etc/vmagent/vmagent.yaml
            - -remoteWrite.url=https://metrics.lab:443/api/v1/write
            - -remoteWrite.tlsCertFile=/certs/tls.crt
            - -remoteWrite.tlsKeyFile=/certs/tls.key
            - -remoteWrite.tlsCAFile=/certs/ca.crt
            - -remoteWrite.tlsInsecureSkipVerify=false
            - -remoteWrite.tlsServerName=metrics.lab
            - -loggerLevel=WARN
          ports:
            - name: http
              containerPort: 8429
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/vmagent
            - name: tls-cert
              mountPath: /certs/tls.crt
              subPath: tls.crt
              readOnly: true
            - name: tls-cert
              mountPath: /certs/tls.key
              subPath: tls.key
              readOnly: true
            - name: ca-cert
              mountPath: /certs/ca.crt
              subPath: ca.crt
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8429
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8429
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: vmagent-config
        - name: tls-cert
          secret:
            secretName: monster-server-cert
            defaultMode: 0644
        - name: ca-cert
          secret:
            secretName: monster-ca-trust
            defaultMode: 0644
