---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: observability
  labels:
    app.kubernetes.io/name: vmagent
    app.kubernetes.io/instance: vmagent
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  vmagent.yaml: |
    global:
      scrape_interval: 30s
      external_labels:
        cluster: "homelab"
        env: "k8s"

    scrape_configs:
      - job_name: k8s-metrics-server
        scrape_interval: 60s
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpointslice
            namespaces:
              names: [default]
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpointslice_name]
            regex: kubernetes
            action: keep
          - source_labels: [__meta_kubernetes_endpointslice_port_name]
            regex: https
            action: keep
          - source_labels: [__meta_kubernetes_endpointslice_port_name]
            regex: (https)
            target_label: __metrics_path__
            replacement: /apis/metrics.k8s.io/v1beta1/nodes

      - job_name: kubelet-cadvisor
        scrape_interval: 30s
        scheme: http
        metrics_path: /metrics/cadvisor
        honor_labels: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            regex: "(.*)"
            target_label: instance
            replacement: "$1"
          - source_labels: [__address__]
            regex: "(.*):10250"
            target_label: __address__
            replacement: "${1}:10255"

      - job_name: kubelet
        scrape_interval: 30s
        scheme: http
        honor_labels: true
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            regex: "(.*)"
            target_label: instance
            replacement: "$1"
          - source_labels: [__address__]
            regex: "(.*):10250"
            target_label: __address__
            replacement: "${1}:10255"

      - job_name: node-exporter
        scrape_interval: 30s
        scheme: http
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [observability]
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
            regex: observability;node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

      - job_name: dcgm-exporter
        scrape_interval: 15s
        scheme: http
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [observability]
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
            regex: observability;dcgm-exporter
            action: keep
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
