---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: observability
  labels:
    app.kubernetes.io/name: vmagent
    app.kubernetes.io/instance: vmagent
    app.kubernetes.io/part-of: observability
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
data:
  vmagent.yaml: |
    global:
      scrape_interval: 30s
      external_labels:
        cluster: "homelab"
        env: "k8s"

    scraping_config:
      - job_name: k8s-metrics-server
        scrape_interval: 60s
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [kube-system]
            selectors:
              - match:
                  name: https
                  port: "4433"
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: (https)
            target_label: __metrics_path__
            replacement: /apis/v1beta1/${1}

      - job_name: kubelet-cadvisor
        scrape_interval: 30s
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [kube-system]
            selectors:
              - match:
                  name: https
                  port: "10250"
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

      - job_name: kubelet
        scrape_interval: 30s
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        honor_labels: true
        kubernetes_sd_configs:
          - role: nodes
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            regex: "(.*)"
            target_label: instance
            replacement: "$1"
          - source_labels: [__address__]
            regex: "(.*):10250"
            target_label: __address__
            replacement: "${1}:10255"

      - job_name: node-exporter
        scrape_interval: 30s
        scheme: http
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [observability]
            selectors:
              - match:
                  name: node-exporter
                  port: "9100"
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance

    prometheus:
      remote_write:
        - url: "http://otel-collector.observability.svc:8888/v1/write"
          queue_config:
            max_items_per_send: 1000
            batch_send_deadline: "30s"
