## =============================================================================
## DUAL-TIER LOCAL PATH PROVISIONER
## Tier 1 (SSD): RAID0 2x SSDs over XFS @ /fast-storage      → local-path-ssd (DEFAULT)
## Tier 2 (HDD): Single HDD over XFS 1TiB @ /cold-storage/k8s    → local-path-hdd
## =============================================================================

# ─── Namespace ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
  labels:
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: local-path-storage
  labels:
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: local-path-storage
  labels:
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"

---
# =============================================================================
# TIER 1 — SSD (FAST) PROVISIONER
# =============================================================================

# ─── ServiceAccount ───────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-ssd-service-account
  namespace: local-path-storage
  labels:
    app.kubernetes.io/name: local-path-ssd
    app.kubernetes.io/instance: local-path-ssd
    app.kubernetes.io/part-of: storage
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

---
# ─── Role (namespace-scoped) ──────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: local-path-ssd-role
  namespace: local-path-storage
  labels:
    app.kubernetes.io/name: local-path-ssd
    app.kubernetes.io/instance: local-path-ssd
    app.kubernetes.io/part-of: storage
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]

---
# ─── ClusterRole ──────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-ssd-role
  labels:
    app.kubernetes.io/name: local-path-ssd
    app.kubernetes.io/instance: local-path-ssd
    app.kubernetes.io/part-of: storage
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: [""]
    resources:
      ["nodes", "persistentvolumeclaims", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

---
# ─── RoleBinding ──────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: local-path-ssd-bind
  namespace: local-path-storage
  labels:
    app.kubernetes.io/name: local-path-ssd
    app.kubernetes.io/instance: local-path-ssd
    app.kubernetes.io/part-of: storage
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: local-path-ssd-role
subjects:
  - kind: ServiceAccount
    name: local-path-ssd-service-account
    namespace: local-path-storage

---
# ─── ClusterRoleBinding ───────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-ssd-bind
  labels:
    app.kubernetes.io/name: local-path-ssd
    app.kubernetes.io/instance: local-path-ssd
    app.kubernetes.io/part-of: storage
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-ssd-role
subjects:
  - kind: ServiceAccount
    name: local-path-ssd-service-account
    namespace: local-path-storage
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage

---
# ─── ConfigMap ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-ssd-config
  namespace: local-path-storage
  labels:
    app.kubernetes.io/name: local-path-ssd
    app.kubernetes.io/instance: local-path-ssd
    app.kubernetes.io/part-of: storage
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  config.json: |-
    {
      "nodePathMap": [
        {
          "node": "DEFAULT_PATH_FOR_NON_LISTED_NODES",
          "paths": ["/fast-storage"]
        }
      ]
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: local-path-ssd-service-account
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
      - name: helper-pod
        image: busybox
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 1m
            memory: 4Mi
          limits:
            cpu: 10m
            memory: 8Mi

---
# ─── Deployment ───────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-ssd-provisioner
  namespace: local-path-storage
  labels:
    app.kubernetes.io/name: local-path-ssd
    app.kubernetes.io/instance: local-path-ssd
    app.kubernetes.io/part-of: storage
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-path-ssd
      app.kubernetes.io/instance: local-path-ssd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-path-ssd
        app.kubernetes.io/instance: local-path-ssd
        app.kubernetes.io/part-of: storage
        app.kubernetes.io/managed-by: argocd
    spec:
      serviceAccountName: local-path-ssd-service-account
      containers:
        - name: local-path-provisioner
          image: rancher/local-path-provisioner:v0.0.35
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - rancher.io/local-path-ssd
            - --helper-pod-file
            - /etc/config/helperPod.yaml
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
      volumes:
        - name: config-volume
          configMap:
            name: local-path-ssd-config

---
# ─── StorageClass (DEFAULT) ───────────────────────────────────────────────────
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-ssd
  labels:
    app.kubernetes.io/name: local-path-ssd
    app.kubernetes.io/instance: local-path-ssd
    app.kubernetes.io/part-of: storage
    app.kubernetes.io/managed-by: argocd
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
    argocd.argoproj.io/sync-wave: "1"
provisioner: rancher.io/local-path-ssd
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain

---
