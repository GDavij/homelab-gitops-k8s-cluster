---
# ─── MinIO Console ────────────────────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-console
  namespace: storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: minio
    app.kubernetes.io/part-of: storage
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`s3-explorer.lab`)
      kind: Rule
      services:
        - name: minio
          port: 9001
  tls:
    secretName: monster-server-cert
    options:
      name: mtls-strict
      namespace: traefik

---
# ─── MinIO S3 API ─────────────────────────────────────────────────────────────
# Exposed separately so SDK clients (LangFuse, MLflow) can use the S3 endpoint.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio-api
  namespace: storage
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: minio
    app.kubernetes.io/part-of: storage
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`s3.lab`)
      kind: Rule
      services:
        - name: minio
          port: 9000
  tls:
    secretName: monster-server-cert
    options:
      name: mtls-strict
      namespace: traefik
