# ─── Qdrant Vector DB UI & API (Consolidated) ───────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qdrant
  namespace: database
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: qdrant
    app.kubernetes.io/part-of: database
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vectors.lab`)
      kind: Rule
      services:
        - name: qdrant
          port: 6333
          
    - match: Host(`proto-vectors.lab`)
      kind: Rule
      services:
        - name: qdrant
          port: 6334
          scheme: h2c
  tls:
    secretName: monster-server-cert
    options:
      name: mtls-strict
      namespace: traefik