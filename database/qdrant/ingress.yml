---
# ─── Qdrant Vector DB UI & API ────────────────────────────────────────────────
# TLSOption now references the global traefik namespace (consolidated).
# Local mtls-strict TLSOption removed from database namespace.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: qdrant
  namespace: database
  labels:
    app.kubernetes.io/name: qdrant
    app.kubernetes.io/instance: qdrant
    app.kubernetes.io/part-of: database
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`qdrant.svc.k8s.monster.lab`)
      kind: Rule
      services:
        - name: qdrant
          port: 6333
  tls:
    secretName: monster-server-cert
    options:
      name: mtls-strict
      namespace: traefik
