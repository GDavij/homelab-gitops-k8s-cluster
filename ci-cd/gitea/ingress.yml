---
# ─── Gitea HTTP UI ────────────────────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitea
  namespace: ci-cd
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: ci-cd
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`repos.lab`)
      kind: Rule
      services:
        - name: gitea
          port: 3000
  tls:
    secretName: monster-server-cert
    options:
      name: mtls-strict
      namespace: traefik

---
# ─── Gitea SSH (TCP passthrough) ──────────────────────────────────────────────
# Git-over-SSH is a TCP stream — Traefik handles it via the tcp entryPoint.
# No TLS termination here; SSH handles its own encryption.
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: gitea-ssh
  namespace: ci-cd
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: ci-cd
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  entryPoints:
    - ssh
  routes:
    - match: HostSNI(`*`)
      services:
        - name: gitea
          port: 2222
