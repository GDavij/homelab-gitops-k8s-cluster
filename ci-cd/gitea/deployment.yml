---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: ci-cd
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/instance: gitea
    app.kubernetes.io/part-of: ci-cd
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
      app.kubernetes.io/instance: gitea
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/instance: gitea
        app.kubernetes.io/part-of: ci-cd
        app.kubernetes.io/managed-by: argocd
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: gitea
          image: gitea/gitea:1.25-rootless
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ssh
              containerPort: 2222
              protocol: TCP
          env:
            - name: GITEA__database__PASSWD
              valueFrom:
                secretKeyRef:
                  name: gitea-secrets
                  key: GITEA_DB_PASSWORD
            - name: GITEA_APP_INI
              value: /etc/gitea/app.ini
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: gitea-config-rw
              mountPath: /etc/gitea
            - name: config
              mountPath: /etc/gitea-ro
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/v1/version
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/version
              port: 3000
            initialDelaySeconds: 60
            periodSeconds: 30
      initContainers:
        - name: copy-config
          image: busybox:1.37
          command: ["sh", "-c", "cp /etc/gitea-ro/app.ini /etc/gitea/app.ini"]
          volumeMounts:
            - name: config
              mountPath: /etc/gitea-ro
            - name: gitea-config-rw
              mountPath: /etc/gitea
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data
        - name: config
          configMap:
            name: gitea-config
        - name: gitea-config-rw
          emptyDir: {}
