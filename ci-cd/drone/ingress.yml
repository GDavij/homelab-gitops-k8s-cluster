---
# ─── Drone CI ─────────────────────────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: drone
  namespace: ci-cd
  labels:
    app.kubernetes.io/name: drone
    app.kubernetes.io/instance: drone
    app.kubernetes.io/part-of: ci-cd
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`drone.svc.k8s.monster.lab`)
      kind: Rule
      services:
        - name: drone
          port: 80
  tls:
    secretName: monster-server-cert
    options:
      name: mtls-strict
      namespace: traefik
