---
# =============================================================================
# VAULT INIT JOB — Initialize Main Vault and seed secrets
# =============================================================================
# Runs at sync wave 5 (after Transit Vault is initialized and Main Vault starts)
# Performs:
#   1. Wait for vault main to be reachable (auto-unsealed by Transit Vault)
#   2. Initialize vault main (if not already) → saves root token to K8s Secret
#   3. Enable KV v2 secrets engine on vault main
#   4. Seed all application KV secrets (idempotent — never overwrites existing values)
#   5. Create ESO vault-token Secret in external-secrets namespace
#
# IDEMPOTENCY: every step checks the current state before acting.
# Safe to re-sync: a completed Job is left as-is by ArgoCD.
# On re-run after deletion: all steps are skipped if already done.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-init
  namespace: security
  labels:
    app.kubernetes.io/name: vault-init
    app.kubernetes.io/instance: vault-init
    app.kubernetes.io/part-of: security
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    # BeforeHookCreation: if the Job is re-created (e.g. after manual deletion),
    # it deletes the old one first so a fresh run can proceed cleanly.
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  ttlSecondsAfterFinished: 600 # clean up completed job after 10 min
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-init
        app.kubernetes.io/part-of: security
    spec:
      serviceAccountName: vault-init
      restartPolicy: OnFailure
      containers:
        - name: vault-init
          image: hashicorp/vault:1.19
          securityContext:
            runAsUser: 0
          command:
            - /bin/sh
            - -ec
            - |
              # ─── install dependencies ─────────────────────────────────────
              apk add --no-cache curl jq >/dev/null

              # ─── helpers ──────────────────────────────────────────────────
              MAIN="http://vault.security.svc:8200"
              K8S="https://kubernetes.default.svc"
              TOKEN_FILE="/var/run/secrets/kubernetes.io/serviceaccount/token"
              CA_FILE="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

              k8s_secret_put() {
                NS=$1; NAME=$2; KEY=$3; VALUE=$4
                B64=$(echo -n "$VALUE" | base64 | tr -d '\n')
                K8S_TOKEN=$(cat "$TOKEN_FILE")
                curl -sf -X POST \
                  "$K8S/api/v1/namespaces/$NS/secrets" \
                  -H "Authorization: Bearer $K8S_TOKEN" \
                  -H "Content-Type: application/json" \
                  --cacert "$CA_FILE" \
                  -d "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"$NAME\",\"namespace\":\"$NS\"},\"data\":{\"$KEY\":\"$B64\"}}" \
                  >/dev/null 2>&1 || \
                curl -sf -X PATCH \
                  "$K8S/api/v1/namespaces/$NS/secrets/$NAME" \
                  -H "Authorization: Bearer $K8S_TOKEN" \
                  -H "Content-Type: application/strategic-merge-patch+json" \
                  --cacert "$CA_FILE" \
                  -d "{\"data\":{\"$KEY\":\"$B64\"}}" \
                  >/dev/null
              }

              vault_ensure_key() {
                PATH_=$1; KEY=$2; VALUE=$3
                CURRENT=$(vault kv get -field="$KEY" "$PATH_" 2>/dev/null) || true
                if [ -n "$CURRENT" ]; then
                  echo "  [skip] $PATH_.$KEY already set"
                  return 0
                fi
                if vault kv get "$PATH_" >/dev/null 2>&1; then
                  vault kv patch "$PATH_" "$KEY=$VALUE" >/dev/null
                else
                  vault kv put "$PATH_" "$KEY=$VALUE" >/dev/null
                fi
                echo "  [set]  $PATH_.$KEY"
              }

              rand_hex()  { cat /dev/urandom | tr -dc 'a-f0-9' | head -c "$1"; }
              rand_b64()  { cat /dev/urandom | base64 | tr -d '\n/' | head -c "$1"; }

              # ─── PHASE 1: vault main ───────────────────────────────────────
              echo ">>> Phase 1: vault main"

              export VAULT_SKIP_VERIFY="true"
              export VAULT_ADDR="$MAIN"
              echo "Waiting for vault main (auto-unsealed by Transit Vault)..."
              until vault status > /tmp/vstatus 2>&1 || [ $? -eq 2 ]; do
                echo "  ...waiting for vault main to respond"
                sleep 5
              done
              echo "vault main reachable."

              vault status -format=json > /tmp/vstatus.json 2>/dev/null || [ $? -eq 2 ]
              V_STATUS=$(cat /tmp/vstatus.json)
              M_INIT=$(echo "$V_STATUS" | jq -r '.initialized')

              if [ "$M_INIT" = "false" ]; then
                echo "Initializing vault main..."
                MINIT=$(vault operator init -recovery-shares=1 -recovery-threshold=1 -format=json)
                M_ROOT=$(echo "$MINIT" | jq -r '.root_token')
                k8s_secret_put security vault-root-token token "$M_ROOT"
                echo "vault main initialized. Root token stored in secret/security/vault-root-token."
              else
                echo "vault main already initialized (M_INIT=$M_INIT)."
                K8S_TOKEN=$(cat "$TOKEN_FILE")
                M_ROOT=$(curl -sf \
                  "$K8S/api/v1/namespaces/security/secrets/vault-root-token" \
                  -H "Authorization: Bearer $K8S_TOKEN" \
                  --cacert "$CA_FILE" | jq -r '.data.token' | base64 -d)
              fi

              export VAULT_ADDR="$MAIN"
              vault login -no-print "$M_ROOT"

              # ─── PHASE 2: KV seed ─────────────────────────────────────────
              echo ""
              echo ">>> Phase 2: KV secrets engine + seed"

              vault secrets enable -path=secret kv-v2 >/dev/null 2>&1 || echo "  [skip] kv already enabled"

              # ── Database passwords ──────────────────────────────────────────
              PG_PASS=$(rand_hex 16)
              CODER_PG_PASS=$(rand_hex 16)
              MLFLOW_PG_PASS=$(rand_hex 16)
              LANGFUSE_PG_PASS=$(rand_hex 16)
              GITEA_PG_PASS=$(rand_hex 16)
              DRONE_PG_PASS=$(rand_hex 16)

              vault_ensure_key secret/database/postgres POSTGRES_PASSWORD     "$PG_PASS"
              vault_ensure_key secret/database/postgres CODER_DB_PASSWORD     "$CODER_PG_PASS"
              vault_ensure_key secret/database/postgres MLFLOW_DB_PASSWORD    "$MLFLOW_PG_PASS"
              vault_ensure_key secret/database/postgres LANGFUSE_DB_PASSWORD  "$LANGFUSE_PG_PASS"
              vault_ensure_key secret/database/postgres GITEA_DB_PASSWORD     "$GITEA_PG_PASS"
              vault_ensure_key secret/database/postgres DRONE_DB_PASSWORD     "$DRONE_PG_PASS"

              # derive connection URLs from whatever password is now stored
              CODER_PW=$(vault kv get   -field=CODER_DB_PASSWORD    secret/database/postgres)
              MLFLOW_PW=$(vault kv get  -field=MLFLOW_DB_PASSWORD   secret/database/postgres)
              LANGFUSE_PW=$(vault kv get -field=LANGFUSE_DB_PASSWORD secret/database/postgres)
              DRONE_PW=$(vault kv get   -field=DRONE_DB_PASSWORD    secret/database/postgres)

              vault_ensure_key secret/database/postgres CODER_DB_URL    "postgres://coder:${CODER_PW}@postgres.database:5432/coder?sslmode=disable"
              vault_ensure_key secret/database/postgres MLFLOW_DB_URL   "postgres://mlflow:${MLFLOW_PW}@postgres.database:5432/mlflow?sslmode=disable"
              vault_ensure_key secret/database/postgres LANGFUSE_DB_URL "postgres://langfuse:${LANGFUSE_PW}@postgres.database:5432/langfuse?sslmode=disable"
              vault_ensure_key secret/database/postgres DRONE_DB_URL    "postgres://drone:${DRONE_PW}@postgres.database:5432/drone?sslmode=disable"

              # ── MinIO ───────────────────────────────────────────────────────
              vault_ensure_key secret/storage/minio MINIO_ROOT_USER     "admin"
              vault_ensure_key secret/storage/minio MINIO_ROOT_PASSWORD "$(rand_hex 16)"

              # ── Langfuse ────────────────────────────────────────────────────
              vault_ensure_key secret/observability/langfuse NEXTAUTH_SECRET  "$(rand_b64 32)"
              vault_ensure_key secret/observability/langfuse SALT             "$(rand_hex 16)"
              vault_ensure_key secret/observability/langfuse ENCRYPTION_KEY   "$(rand_hex 64)"

              # ── Drone CI ────────────────────────────────────────────────────
              vault_ensure_key secret/ci-cd/drone DRONE_RPC_SECRET           "$(rand_hex 32)"
              vault_ensure_key secret/ci-cd/drone DRONE_GITEA_CLIENT_ID      " "
              vault_ensure_key secret/ci-cd/drone DRONE_GITEA_CLIENT_SECRET  " "

              # ── RabbitMQ ────────────────────────────────────────────────────
              vault_ensure_key secret/stack/rabbitmq RABBITMQ_DEFAULT_USER "admin"
              vault_ensure_key secret/stack/rabbitmq RABBITMQ_DEFAULT_PASS "$(rand_hex 16)"

              # ── Coder ───────────────────────────────────────────────────────
              CODER_PW=$(vault kv get -field=CODER_DB_PASSWORD secret/database/postgres)
              vault_ensure_key secret/ci-cd/coder CODER_PG_CONNECTION_URL \
                "postgres://coder:${CODER_PW}@postgres.database:5432/coder?sslmode=disable"

              # ── AI Services ──────────────────────────────────────────────────
              # Placeholder — replace with real token via:
              #   vault kv patch secret/ai-services/vllm HF_TOKEN=hf_xxxxx
              vault_ensure_key secret/ai-services/vllm HF_TOKEN "CHANGE_ME"

              echo "KV secrets seeded."

              # ─── PHASE 3: ESO token ────────────────────────────────────────
              echo ""
              echo ">>> Phase 3: ESO authentication token"

              printf 'path "secret/*" { capabilities = ["create","read","update","delete","list"] }\npath "sys/mounts" { capabilities = ["read","list"] }\npath "sys/mounts/*" { capabilities = ["read"] }\n' \
                > /tmp/eso-policy.hcl
              vault policy write eso-readonly /tmp/eso-policy.hcl >/dev/null

              ESO_TOKEN=$(vault token create -orphan -policy=eso-readonly \
                -period=8760h -format=json | grep '"client_token"' | cut -d'"' -f4)
              k8s_secret_put external-secrets vault-token token "$ESO_TOKEN"
              echo "ESO vault-token stored in external-secrets namespace."

              echo ""
              echo "=== vault-init complete. All systems ready. ==="
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          env:
            - name: VAULT_SKIP_VERIFY
              value: "true"
