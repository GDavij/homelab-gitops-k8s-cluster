---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devenv-db-credentials
  namespace: dev-env
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: devenv-db-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: database/postgres
        property: POSTGRES_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: devenv-git-credentials
  namespace: dev-env
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: devenv-git-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: dev-env/git-credentials
        property: GITHUB_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: AZURE_DEVOPS_TOKEN
      remoteRef:
        key: dev-env/git-credentials
        property: AZURE_DEVOPS_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
