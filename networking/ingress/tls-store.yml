---
# Default TLS certificate for all IngressRoutes that don't specify one explicitly.
# monster-server-cert is created by pki Ansible role and replicated by Reflector.
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik
    app.kubernetes.io/part-of: traefik
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  defaultCertificate:
    secretName: monster-server-cert
