---
# ─── RabbitMQ AMQP (TCP) ─────────────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: rabbitmq-amqp
  namespace: stack
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: rabbitmq
    app.kubernetes.io/part-of: stack
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`amqp.lab`)
      services:
        - name: rabbitmq
          port: 5672
  tls:
    secretName: monster-server-cert
    options:
      name: mtls-strict
      namespace: traefik

---
# ─── RabbitMQ Management UI ───────────────────────────────────────────────────
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rabbitmq
  namespace: stack
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: rabbitmq
    app.kubernetes.io/part-of: stack
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rabbit.lab`)
      kind: Rule
      services:
        - name: rabbitmq
          port: 15672
  tls:
    secretName: monster-server-cert
    options:
      name: mtls-strict
      namespace: traefik
