---
# ─── RabbitMQ Management UI ───────────────────────────────────────────────────
# Only the management UI is exposed externally (mTLS protected).
# AMQP (5672) is internal-only — accessed as rabbitmq.stack.svc:5672 from pods.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rabbitmq
  namespace: stack
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: rabbitmq
    app.kubernetes.io/part-of: stack
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`rabbit.lab`)
      kind: Rule
      services:
        - name: rabbitmq
          port: 15672
  tls:
    secretName: monster-server-cert
    options:
      name: mtls-strict
      namespace: traefik
