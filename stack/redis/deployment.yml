---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-stack
  namespace: stack
  labels:
    app.kubernetes.io/name: redis-stack
    app.kubernetes.io/instance: redis-stack
    app.kubernetes.io/part-of: stack
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-stack
      app.kubernetes.io/instance: redis-stack
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-stack
        app.kubernetes.io/instance: redis-stack
        app.kubernetes.io/part-of: stack
        app.kubernetes.io/managed-by: argocd
    spec:
      containers:
        - name: redis-stack
          image: redis/redis-stack-server:7.4.0-v8
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            readOnlyRootFilesystem: false
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_ARGS
              value: '--maxmemory 256mb --maxmemory-policy noeviction --save "" --appendonly no --stop-writes-on-bgsave-error no'
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
