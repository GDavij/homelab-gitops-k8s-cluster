---
# vLLM — High-performance LLM inference with OpenAI-compatible API
#
#
#
# Runtime: scale to 0 when not in use, scale to 1 to serve.
#         Do NOT run simultaneously with Ollama — both claim nvidia.com/gpu: "1".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai-services
  labels:
    app.kubernetes.io/name: vllm
    app.kubernetes.io/instance: vllm
    app.kubernetes.io/part-of: ai-services
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
      app.kubernetes.io/instance: vllm
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm
        app.kubernetes.io/instance: vllm
        app.kubernetes.io/part-of: ai-services
        app.kubernetes.io/managed-by: argocd
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: vllm
          image: vllm/vllm-openai:gemma4
          command: ["/bin/sh", "-c"]
          args:
            - |
              vllm serve "$VLLM_MODEL" \
                --host 0.0.0.0 \
                --port 8000 \
                --trust-remote-code \
                --gpu-memory-utilization 0.88 \
                --max-model-len 4096 \
                --max-num-seqs 2 \
                --dtype auto
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: VLLM_MODEL
              value: "google/gemma-4-E2B-it"
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: "spawn"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: VLLM_DO_NOT_TRACK
              value: "1"
            # HF_HUB_OFFLINE and TRANSFORMERS_OFFLINE removed — model needs
            # to be downloaded on first run since PVC is empty after reset
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HF_TOKEN
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache/huggingface
            - name: shm
              mountPath: /dev/shm
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "6"
              memory: 12Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 30
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: "2Gi"
