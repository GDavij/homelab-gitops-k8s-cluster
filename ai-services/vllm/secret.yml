---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: vllm-secrets
  namespace: ai-services
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vllm-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: HF_TOKEN
      remoteRef:
        key: ai-services/vllm
        property: HF_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
