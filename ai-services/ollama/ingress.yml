---
# ─── Ollama LLM API ───────────────────────────────────────────────────────────
# mTLS enforced: only clients with the monster-ca-trust cert can call the API.
# TLSOption declared in traefik ns (global) — referenced cross-namespace.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ollama
  namespace: ai-services
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/instance: ollama
    app.kubernetes.io/part-of: ai-services
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`llms.lab`)
      kind: Rule
      services:
        - name: ollama
          port: 11434
  tls:
    secretName: monster-server-cert
    options:
      name: mtls-strict
      namespace: traefik
