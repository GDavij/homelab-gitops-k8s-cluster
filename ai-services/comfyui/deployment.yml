---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui
  namespace: ai-services
  labels:
    app.kubernetes.io/name: comfyui
    app.kubernetes.io/instance: comfyui
    app.kubernetes.io/part-of: ai-services
    app.kubernetes.io/managed-by: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: comfyui
      app.kubernetes.io/instance: comfyui
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: comfyui
        app.kubernetes.io/instance: comfyui
        app.kubernetes.io/part-of: ai-services
        app.kubernetes.io/managed-by: argocd
    spec:
      runtimeClassName: nvidia
      containers:
        - name: comfyui
          image: yanwk/comfyui-boot:cu128-megapak
          ports:
            - name: http
              containerPort: 8188
              protocol: TCP
          env:
            - name: CLI_ARGS
              value: "--listen 0.0.0.0 --port 8188"
          volumeMounts:
            - name: data
              mountPath: /root
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /
              port: 8188
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 8188
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: comfyui-data
      nodeSelector:
        nvidia.com/gpu.present: "true"
